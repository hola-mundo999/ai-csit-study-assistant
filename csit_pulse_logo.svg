<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield with Soft Radius -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#pulseGrad)" filter="url(#glow)"/>
  
  <!-- Graduation Cap Top -->
  <path d="M24 11L38 18L24 25L10 18L24 11Z" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Cap Underbody -->
  <path d="M15 21.5V26.5C15 29.5 19 32 24 32C29 32 33 29.5 33 26.5V21.5L24 26L15 21.5Z" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- Pulse Wave Line (representing CSIT Pulse) -->
  <path d="M12 37H17L20 33L23 41L27 31L30 37H36" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tassel -->
  <circle cx="38" cy="18" r="1.5" fill="#facc15"/>
  <path d="M38 18V24" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
</svg>
